---
layout: default
---

<article class="post essay-post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      Published: {{ page.date | date: "%B %d, %Y" }}
      {%- assign words = content | number_of_words -%}
      · {{ words | divided_by: 180 | plus: 1 }} minute read
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
