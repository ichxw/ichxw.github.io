<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {%- seo -%}
    {%- feed_meta -%}
  </head>
  <body>
    <div class="site-shell">
      <div class="layout-shell">
        <aside class="sidebar">
          <div class="sidebar-inner">
            {%- if site.author.profile_image -%}
            <div class="profile-photo-wrap">
              <img class="profile-photo" src="{{ site.author.profile_image | relative_url }}" alt="{{ site.author.name }} profile photo" />
            </div>
            {%- endif -%}

            <h1 class="sidebar-name"><a href="{{ '/' | relative_url }}">{{ site.author.name }}</a></h1>
            <p class="sidebar-tagline">{{ site.author.tagline }}</p>
            <p class="sidebar-location">{{ site.author.location }}</p>

            <div class="sidebar-bio">
              <p>{{ site.author.bio }}</p>
            </div>

            <nav class="sidebar-nav">
              <a href="{{ '/' | relative_url }}">Blog</a>
              <a href="{{ '/about/' | relative_url }}">About</a>
              <a href="{{ site.social.github }}">GitHub</a>
              <a href="{{ site.social.email }}">Email</a>
            </nav>
          </div>
        </aside>

        <main class="main-column">
          <div class="main-inner">
            {{ content }}
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
